# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Content editing for Pépinière Semences d'Avenir — open https://www.psa.com/admin
# Every save is a commit on GitHub; Vercel then rebuilds the site (≈ 1–2 minutes).

backend:
  name: github
  repo: ubuntu-assist/psa-website
  branch: master
  # OAuth sign-in (« Se connecter avec GitHub ») is served by this site: /api/auth/*
  base_url: https://www.psa.com
  auth_endpoint: api/auth
  commit_messages:
    create: 'Contenu : ajout de « {{slug}} » ({{collection}})'
    update: 'Contenu : mise à jour de « {{slug}} » ({{collection}})'
    delete: 'Contenu : suppression de « {{slug}} » ({{collection}})'
    uploadMedia: 'Médias : ajout de « {{path}} »'
    deleteMedia: 'Médias : suppression de « {{path}} »'

site_url: https://www.psa.com
display_url: https://www.psa.com
logo:
  src: /favicon.svg

# uploaded images & documents
media_folder: static/assets/images/psa/uploads
public_folder: /assets/images/psa/uploads

i18n:
  structure: single_file
  locales: [fr, en]
  default_locale: fr

collections:
  # ───────────────────────── Blog ─────────────────────────
  - name: blog
    label: Blog
    label_singular: Article
    description: Articles du blog. Le texte est en Markdown (titres, gras, liens, listes…).
    folder: src/content/blog
    format: json
    create: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    i18n: true
    preview_path: /blog/{{slug}}
    fields:
      - { name: title, label: Titre, widget: string, i18n: true }
      - { name: category, label: Catégorie, widget: string, i18n: true, hint: 'Ex. Conseils pépinière, Semences, Fertilité des sols…' }
      - { name: date, label: Date de publication, widget: datetime, type: date, i18n: duplicate }
      - { name: image, label: Image de couverture, widget: image, i18n: duplicate, hint: 'Format paysage, au moins 1200 px de large de préférence.' }
      - { name: excerpt, label: Résumé, widget: text, i18n: true, hint: 'Une ou deux phrases : affiché sur les cartes et dans les aperçus de partage.' }
      - { name: body, label: Texte de l'article, widget: markdown, i18n: true }

  # ───────────────────────── Équipe, partenaires, médiathèque ─────────────────────────
  - name: site
    label: Équipe, partenaires & médiathèque
    description: Contenus des pages À propos, Partenaires et Médiathèque.
    i18n: true
    editor:
      preview: false
    files:
      - name: team
        label: Équipe
        file: src/content/team.json
        format: json
        i18n: true
        fields:
          - { name: groupPhoto, label: Photo de groupe, widget: image, i18n: duplicate }
          - name: members
            label: Membres
            label_singular: Membre
            widget: list
            i18n: true
            summary: '{{fields.name}} — {{fields.role}}'
            hint: 'Glissez-déposez pour changer l''ordre. Les 3 premiers apparaissent en tête.'
            fields:
              - { name: name, label: Nom, widget: string, i18n: duplicate }
              - { name: role, label: Poste, widget: string, i18n: true }
              - { name: photo, label: Photo (portrait), widget: image, required: false, i18n: duplicate, hint: 'Sans photo, les initiales sont affichées.' }

      - name: partners
        label: Partenaires
        file: src/content/partners.json
        format: json
        i18n: false
        fields:
          - name: institutional
            label: Partenaires institutionnels
            label_singular: Partenaire
            widget: list
            summary: '{{fields.name}}'
            fields: &partner
              - { name: name, label: Nom, widget: string }
              - { name: logo, label: Logo, widget: image, hint: 'PNG sur fond blanc ou transparent.' }
              - { name: url, label: Site web, widget: string, required: false }
          - name: technical
            label: Partenaires techniques
            label_singular: Partenaire
            widget: list
            summary: '{{fields.name}}'
            fields: *partner

      - name: mediatheque
        label: Médiathèque
        file: src/content/mediatheque.json
        format: json
        i18n: true
        fields:
          - name: docs
            label: Documents
            label_singular: Document
            widget: list
            i18n: true
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Titre, widget: string, i18n: true }
              - { name: text, label: Description, widget: string, i18n: true }
              - { name: file, label: Fichier (image ou PDF), widget: file, i18n: duplicate }
          - name: photos
            label: Photos
            label_singular: Photo
            widget: list
            i18n: true
            summary: '{{fields.caption}}'
            fields:
              - { name: image, label: Photo, widget: image, i18n: duplicate }
              - { name: caption, label: Légende, widget: string, i18n: true }
          - name: videos
            label: Vidéos YouTube
            label_singular: Vidéo
            widget: list
            i18n: true
            required: false
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Titre, widget: string, i18n: true }
              - { name: url, label: Lien YouTube, widget: string, i18n: duplicate, hint: 'Ex. https://www.youtube.com/watch?v=… ou https://youtu.be/…' }

  # ───────────────────────── Calendrier des semis ─────────────────────────
  - name: calendar
    label: Calendrier des semis
    description: Cultures affichées sur la page /calendrier et sur l'accueil (« Que semer ce mois-ci ? »).
    i18n: true
    editor:
      preview: false
    files:
      - name: calendar
        label: Calendrier des semis
        file: src/content/calendar.json
        format: json
        i18n: true
        fields:
          - { name: intro, label: Introduction, widget: text, i18n: true }
          - name: crops
            label: Cultures
            label_singular: Culture
            widget: list
            i18n: true
            summary: '{{fields.name}}'
            hint: 'Mois : 1 = janvier … 12 = décembre.'
            fields:
              - { name: name, label: Culture, widget: string, i18n: true }
              - name: category
                label: Groupe
                widget: select
                i18n: duplicate
                options:
                  - { label: Vivrier, value: vivrier }
                  - { label: Maraîcher, value: maraicher }
                  - { label: Fruitiers, value: fruitier }
                  - { label: Cultures de rente, value: rente }
              - &months { name: sow, label: Mois de semis direct, widget: select, multiple: true, required: false, i18n: duplicate, options: [{ label: Janvier, value: 1 }, { label: Février, value: 2 }, { label: Mars, value: 3 }, { label: Avril, value: 4 }, { label: Mai, value: 5 }, { label: Juin, value: 6 }, { label: Juillet, value: 7 }, { label: Août, value: 8 }, { label: Septembre, value: 9 }, { label: Octobre, value: 10 }, { label: Novembre, value: 11 }, { label: Décembre, value: 12 }] }
              - { <<: *months, name: nursery, label: Mois de pépinière }
              - { <<: *months, name: plant, label: Mois de plantation / repiquage }
              - { <<: *months, name: harvest, label: Mois de récolte }
              - { name: tip, label: Conseil, widget: text, i18n: true }
