<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pépinière Semences d'Avenir — simplified mark for small sizes (sun · hand · seedling) -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FDBE00"/>
    </radialGradient>
  </defs>
  <!-- rays -->
  <g fill="#F7A600">
    <path id="r" d="M32 1.5 L35.6 12 L28.4 12 Z"/>
    <use href="#r" transform="rotate(30 32 32)"/>
    <use href="#r" transform="rotate(60 32 32)"/>
    <use href="#r" transform="rotate(90 32 32)"/>
    <use href="#r" transform="rotate(120 32 32)"/>
    <use href="#r" transform="rotate(150 32 32)"/>
    <use href="#r" transform="rotate(180 32 32)"/>
    <use href="#r" transform="rotate(210 32 32)"/>
    <use href="#r" transform="rotate(240 32 32)"/>
    <use href="#r" transform="rotate(270 32 32)"/>
    <use href="#r" transform="rotate(300 32 32)"/>
    <use href="#r" transform="rotate(330 32 32)"/>
  </g>
  <!-- disc -->
  <circle cx="32" cy="32" r="21.5" fill="url(#disc)" stroke="#E58B00" stroke-width="1.6"/>
  <!-- soil -->
  <ellipse cx="32" cy="40.2" rx="7.4" ry="2.6" fill="#5A3416"/>
  <!-- hand (cupped palm) -->
  <path d="M15.5 39.5 C 19 37.8, 23 38.6, 26 40.4 C 29.5 42.4, 35 42.6, 39.5 40.6 L 47.5 37 C 49.6 36.1, 50.6 38.1, 49 39.3 L 41.5 45 C 37.5 48, 30 48.6, 24.5 47.2 C 21 46.3, 18 44.6, 15.5 43.6 Z" fill="#2FA84F" stroke="#16692F" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- seedling -->
  <path d="M32 39.6 C 32 34, 31.6 29.5, 32.3 24.5" fill="none" stroke="#16692F" stroke-width="2" stroke-linecap="round"/>
  <path d="M32.1 30.5 C 27.5 30.6, 23.2 27.6, 22.4 22.6 C 27.4 22.4, 31.2 25.4, 32.1 30.5 Z" fill="#2FA84F" stroke="#16692F" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M32.4 26.6 C 33.2 21.4, 37.4 17.8, 42.6 17.8 C 42 22.9, 37.8 26.5, 32.4 26.6 Z" fill="#2FA84F" stroke="#16692F" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
